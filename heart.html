<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Where Your Heart Is</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f8f5f0;
      font-family: Arial, sans-serif;
      color: #333;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 50px 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .description {
      margin-bottom: 40px;
      color: #777;
      text-align: center;
    }

    /* 하트 전체 */
    .heart {
      display: grid;

      /* 7칸짜리 그리드 */
      grid-template-columns: repeat(7, 70px);
      grid-template-rows: repeat(6, 70px);

      gap: 5px;

      margin-bottom: 40px;
    }

    /* 사진 한 칸 */
    .photo {
      width: 70px;
      height: 70px;

      background: #ddd;

      overflow: hidden;

      cursor: pointer;

      transition: transform 0.3s ease;
    }

    .photo:hover {
      transform: scale(1.08);
    }

    .photo img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }

    /* 사진 업로드 버튼 */
    .upload-button {
      display: inline-block;

      padding: 14px 25px;

      background: #333;
      color: white;

      border-radius: 30px;

      cursor: pointer;

      font-size: 15px;
    }

    .upload-button:hover {
      opacity: 0.8;
    }

    #fileInput {
      display: none;
    }

    .count {
      margin-top: 15px;
      font-size: 14px;
      color: #888;
    }

    /* 모바일 */
    @media (max-width: 600px) {

      .heart {
        grid-template-columns: repeat(7, 42px);
        grid-template-rows: repeat(6, 42px);

        gap: 3px;
      }

      .photo {
        width: 42px;
        height: 42px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>


<body>

  <h1>Where Your Heart Is</h1>

  <div class="description">
    당신의 마음이 머무는 순간을 남겨주세요.
  </div>


  <!-- 하트 -->
  <div class="heart">

    <!-- 1번째 줄 -->
    <div class="photo" style="grid-column: 2;"></div>
    <div class="photo" style="grid-column: 3;"></div>
    <div class="photo" style="grid-column: 5;"></div>
    <div class="photo" style="grid-column: 6;"></div>

    <!-- 2번째 줄 -->
    <div class="photo" style="grid-column: 1;"></div>
    <div class="photo" style="grid-column: 2;"></div>
    <div class="photo" style="grid-column: 3;"></div>
    <div class="photo" style="grid-column: 4;"></div>
    <div class="photo" style="grid-column: 5;"></div>
    <div class="photo" style="grid-column: 6;"></div>
    <div class="photo" style="grid-column: 7;"></div>

    <!-- 3번째 줄 -->
    <div class="photo" style="grid-column: 1;"></div>
    <div class="photo" style="grid-column: 2;"></div>
    <div class="photo" style="grid-column: 3;"></div>
    <div class="photo" style="grid-column: 4;"></div>
    <div class="photo" style="grid-column: 5;"></div>
    <div class="photo" style="grid-column: 6;"></div>
    <div class="photo" style="grid-column: 7;"></div>

    <!-- 4번째 줄 -->
    <div class="photo" style="grid-column: 2;"></div>
    <div class="photo" style="grid-column: 3;"></div>
    <div class="photo" style="grid-column: 4;"></div>
    <div class="photo" style="grid-column: 5;"></div>
    <div class="photo" style="grid-column: 6;"></div>

    <!-- 5번째 줄 -->
    <div class="photo" style="grid-column: 3;"></div>
    <div class="photo" style="grid-column: 4;"></div>
    <div class="photo" style="grid-column: 5;"></div>

    <!-- 6번째 줄 -->
    <div class="photo" style="grid-column: 4;"></div>

  </div>


  <!-- 사진 업로드 -->
  <label class="upload-button">
    + 사진 남기기
    <input
      type="file"
      id="fileInput"
      accept="image/*"
      multiple
    >
  </label>

  <div class="count">
    0 / 27개의 마음이 모였어요
  </div>


<script>

  const input = document.getElementById("fileInput");
  const photos = document.querySelectorAll(".photo");
  const count = document.querySelector(".count");

  let currentPhoto = 0;


  input.addEventListener("change", function(event) {

    const files = Array.from(event.target.files);

    files.forEach(file => {

      if (currentPhoto >= photos.length) {
        return;
      }

      const reader = new FileReader();

      reader.onload = function(e) {

        const img = document.createElement("img");

        img.src = e.target.result;

        photos[currentPhoto].appendChild(img);

        currentPhoto++;

        count.innerText =
          currentPhoto + " / 27개의 마음이 모였어요";

      };

      reader.readAsDataURL(file);

    });

  });

</script>

</body>
</html>
