<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Where Your Heart Is</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;

      background: #000;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: 'Bochan Serif', serif;
      color: #333;
    }

    .home {
      text-align: center;
    }

    .number {
      font-size: 14px;
      letter-spacing: 4px;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 48px;
      font-weight: 500;
      letter-spacing: 3px;
      margin: 0 0 20px;
    }

    .subtitle {
      font-size: 16px;
      line-height: 1.8;
      color: #777;
      margin-bottom: 45px;
    }

    .enter {
      display: inline-block;

      padding: 15px 35px;

      border: 1px solid #333;
      border-radius: 30px;

      color: #333;
      text-decoration: none;

      font-size: 14px;
      letter-spacing: 2px;

      transition: all 0.3s;
    }

    .enter:hover {
      background: #333;
      color: white;
    }

    @media (max-width: 600px) {

      h1 {
        font-size: 32px;
      }

      .subtitle {
        font-size: 14px;
      }
    }
  </style>
</head>


<body>

  <main class="home">

    <div class="number">
      555
    </div>

    <h1>
      WHERE YOUR<br>
      HEART IS
    </h1>

    <div class="subtitle">
      5:55 안녕?
    </div>

    <a href="heart.html" class="enter">
      ENTER
    </a>

  </main>

</body>
</html>
